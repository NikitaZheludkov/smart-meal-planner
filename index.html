<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Smart Meal Planner</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            'up': '0 -4px 20px -2px rgba(0, 0, 0, 0.05)',
          },
          colors: {
            slate: { 850: '#151e2e', 900: '#0f172a' } // Глубокий черный
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #f8fafc; color: #0f172a; overflow: hidden; -webkit-tap-highlight-color: transparent; }
    input, textarea, select { font-size: 16px !important; } /* Fix iOS zoom */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .pt-safe { padding-top: env(safe-area-inset-top); }
    
    /* UI PATTERNS */
    .tap-effect { transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.1s; }
    .tap-effect:active { transform: scale(0.96); opacity: 0.8; }
    
    .glass-header { 
        background: rgba(255, 255, 255, 0.96); 
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(0,0,0,0.04); 
        z-index: 40; 
        border-bottom-left-radius: 32px; 
        border-bottom-right-radius: 32px; 
        box-shadow: 0 10px 30px -10px rgba(0,0,0,0.03); 
    }

    .glass-nav {
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(16px);
        border-top: 1px solid rgba(0,0,0,0.04);
        border-top-left-radius: 32px;
        border-top-right-radius: 32px;
        box-shadow: 0 -10px 30px -10px rgba(0,0,0,0.03);
    }
    
    .gpu { transform: translateZ(0); will-change: transform, opacity; }

    /* ANIMATIONS */
    .fade-enter-active, .fade-leave-active { transition: opacity 0.15s ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }
    
    .slide-left-enter-active, .slide-left-leave-active, .slide-right-enter-active, .slide-right-leave-active { 
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
        position: absolute; width: 100%; 
    }
    .slide-left-enter-from { transform: translateX(20px); opacity: 0; }
    .slide-left-leave-to { transform: translateX(-20px); opacity: 0; }
    .slide-right-enter-from { transform: translateX(-20px); opacity: 0; }
    .slide-right-leave-to { transform: translateX(20px); opacity: 0; }

    .modal-enter-active, .modal-leave-active { transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1); }
    .modal-enter-from, .modal-leave-to { transform: translateY(100%); }

    .list-enter-active, .list-leave-active { transition: all 0.3s ease; }
    .list-enter-from, .list-leave-to { opacity: 0; height: 0; transform: scale(0.95); margin-bottom: 0; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
  <div id="app" class="flex flex-col h-[100dvh] max-w-md mx-auto bg-slate-50 shadow-2xl relative overflow-hidden">
    
    <div v-if="!user" class="absolute inset-0 z-[100] bg-white flex flex-col items-center justify-center p-8">
        <h1 class="text-3xl font-black text-slate-900 mb-2 tracking-tight">Smart Meal Planner</h1>
        <p class="text-slate-400 font-bold text-sm mb-10 text-center">Кухонная логистика нового поколения</p>
        <div class="w-full space-y-4">
            <input v-model="authEmail" type="email" placeholder="Email" class="w-full p-5 rounded-3xl bg-slate-50 font-bold text-slate-900 outline-none focus:ring-2 focus:ring-slate-900 transition-all placeholder-slate-300">
            <input v-model="authPass" type="password" placeholder="Пароль" class="w-full p-5 rounded-3xl bg-slate-50 font-bold text-slate-900 outline-none focus:ring-2 focus:ring-slate-900 transition-all placeholder-slate-300">
            <button @click="handleLogin" :disabled="loading" class="w-full py-5 bg-slate-900 text-white rounded-3xl font-extrabold text-lg tap-effect shadow-xl disabled:opacity-50">
                {{ loading ? 'Вход...' : 'Начать' }}
            </button>
        </div>
    </div>

    <template v-else>
        <header class="glass-header pt-safe flex-shrink-0 relative mb-1 transition-all duration-300">
            <div class="px-6 py-4 flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-black tracking-tight text-slate-900">{{ pageTitle }}</h1>
                    <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mt-0.5">{{ user.email.split('@')[0] }}</div>
                </div>
                <div v-if="loading" class="animate-spin rounded-full h-5 w-5 border-2 border-slate-200 border-t-slate-900"></div>
                <button v-else-if="currentTab==='settings'" @click="saveSettings" class="text-xs font-black text-indigo-500 bg-indigo-50 px-3 py-1.5 rounded-xl tap-effect">Сохранить</button>
            </div>
            
            <div v-if="currentTab === 'calendar'" class="px-5 pb-6 space-y-4">
                <div class="flex bg-slate-100 p-1 rounded-2xl relative h-10 shadow-inner">
                     <div class="absolute top-1 bottom-1 bg-white rounded-xl shadow-sm w-[calc(50%-4px)] transition-all duration-300 ease-[cubic-bezier(0.3,1.2,0.2,1)]" :class="planViewMode === 'day' ? 'left-1' : 'left-[calc(50%+2px)]'"></div>
                     <button @click="planViewMode = 'day'" class="flex-1 relative z-10 text-xs font-extrabold flex items-center justify-center transition-colors" :class="planViewMode === 'day' ? 'text-slate-900' : 'text-slate-400'">День</button>
                     <button @click="planViewMode = 'week'" class="flex-1 relative z-10 text-xs font-extrabold flex items-center justify-center transition-colors" :class="planViewMode === 'week' ? 'text-slate-900' : 'text-slate-400'">Сетка</button>
                </div>
                
                <div class="flex items-center justify-between">
                     <button @click="handleNav(-1)" class="w-10 h-10 flex items-center justify-center text-slate-400 bg-white rounded-full shadow-soft tap-effect border border-slate-50"><span class="material-icons-round">chevron_left</span></button>
                     <div class="text-center flex-1">
                        <div class="text-base font-black text-slate-900">{{ planViewMode === 'day' ? currentDateDisplay : shoppingRangeDisplay }}</div>
                        <div v-if="planViewMode === 'day'" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">{{ dayNameDisplay }}</div>
                     </div>
                     <button @click="handleNav(1)" class="w-10 h-10 flex items-center justify-center text-slate-400 bg-white rounded-full shadow-soft tap-effect border border-slate-50"><span class="material-icons-round">chevron_right</span></button>
                </div>
            </div>
            
            <div v-else-if="currentTab === 'products' || currentTab === 'dishes'" class="px-0 pb-4 space-y-3">
                <div class="px-5">
                    <div class="relative group h-11">
                        <span class="material-icons-round absolute left-4 top-3 text-slate-400">search</span>
                        <input v-model="genericSearch" type="text" placeholder="Поиск..." class="w-full pl-11 pr-4 h-full bg-slate-100 rounded-2xl border-none outline-none focus:ring-2 focus:ring-slate-900 text-sm font-bold text-slate-900 placeholder-slate-400 transition-all shadow-inner">
                    </div>
                </div>
                <div class="overflow-x-auto pl-5 pr-5 no-scrollbar flex gap-2 pb-2">
                    <button @click="activeCategory = 'Все'" :class="activeCategory === 'Все' ? 'bg-slate-900 text-white shadow-lg' : 'bg-white text-slate-500 border border-slate-100 shadow-sm'" class="px-4 py-2 rounded-full text-xs font-extrabold whitespace-nowrap tap-effect transition-all">Все</button>
                    <button v-for="cat in (currentTab==='dishes' ? dishCategories : productCategories)" :key="cat" @click="activeCategory = cat" :class="activeCategory === cat ? 'bg-slate-900 text-white shadow-lg' : 'bg-white text-slate-500 border border-slate-100 shadow-sm'" class="px-4 py-2 rounded-full text-xs font-extrabold whitespace-nowrap tap-effect transition-all">{{ cat }}</button>
                </div>
            </div>
            
            <div v-else-if="currentTab === 'list'" class="px-5 pb-6">
                 <div class="flex items-center justify-between bg-slate-100 px-4 rounded-2xl h-12 mb-3">
                     <div class="flex-1 h-2.5 bg-white rounded-full overflow-hidden shadow-inner">
                         <div class="h-full bg-slate-900 transition-all duration-700 ease-out rounded-full" :style="{ width: shoppingProgress + '%' }"></div>
                     </div>
                     <span class="ml-4 text-xs font-black text-slate-400 tabular-nums">{{ shoppingStats.checked }}/{{ shoppingStats.total }}</span>
                  </div>
                  <div class="flex gap-2">
                      <button @click="uncheckAll" class="flex-1 py-3 bg-white border border-slate-100 rounded-xl text-xs font-black text-rose-500 shadow-soft tap-effect">Очистить</button>
                      <button @click="loadInitialData" class="flex-1 py-3 bg-slate-900 rounded-xl text-xs font-black text-white shadow-lg tap-effect">Обновить</button>
                  </div>
            </div>
        </header>

        <main class="flex-1 relative bg-slate-50">
             <transition :name="mainTransitionName">
                
                <div v-if="currentTab === 'calendar'" class="absolute inset-0 overflow-y-auto p-5 pb-28 no-scrollbar gpu">
                    <transition name="fade" mode="out-in">
                    <div v-if="planViewMode === 'day'" :key="'day'+currentDateStr" class="space-y-4">
                         
                         <div class="bg-white rounded-3xl p-4 shadow-soft border border-slate-100 flex items-center justify-between mb-2">
                             <div class="flex items-center gap-3">
                                 <div class="w-10 h-10 rounded-full bg-orange-50 text-orange-500 flex items-center justify-center font-black text-sm">🔥</div>
                                 <div>
                                     <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Итого за день</div>
                                     <div class="text-xl font-black text-slate-900 leading-none">{{ dailyNutrition.k }} <span class="text-xs text-slate-400 font-bold">ккал</span></div>
                                 </div>
                             </div>
                             <div class="flex gap-2 opacity-30 grayscale">
                                <div class="text-[9px] font-bold text-center"><span class="block text-slate-400">Б</span><span class="text-slate-900">0</span></div>
                                <div class="text-[9px] font-bold text-center"><span class="block text-slate-400">Ж</span><span class="text-slate-900">0</span></div>
                                <div class="text-[9px] font-bold text-center"><span class="block text-slate-400">У</span><span class="text-slate-900">0</span></div>
                             </div>
                         </div>

                         <div v-if="!mealSlots.some(s => getPlannedDish(currentDateStr, s))" class="flex flex-col items-center justify-center py-10 opacity-30">
                             <span class="material-icons-round text-5xl mb-2 text-slate-300">event_available</span>
                             <p class="text-xs font-bold text-slate-400">План пуст</p>
                         </div>
                         
                         <div v-for="slot in mealSlots" :key="slot">
                            <div v-if="getPlannedDish(currentDateStr, slot)" @click="openDishDetails(getPlannedDish(currentDateStr, slot))" class="bg-white p-5 rounded-3xl shadow-soft border border-slate-50 tap-effect cursor-pointer relative overflow-hidden group">
                                <div class="absolute left-0 top-0 bottom-0 w-1.5" :class="getSlotColor(slot)"></div>
                                <div class="flex justify-between items-center mb-2 pl-3">
                                    <span class="text-[10px] font-extrabold uppercase tracking-widest text-slate-400">{{ slot }}</span>
                                    <div class="flex items-center gap-2">
                                        <span v-if="getPlannedPortions(currentDateStr, slot) > 1" class="text-[10px] font-black bg-indigo-50 text-indigo-600 px-2 py-1 rounded-lg">x{{ getPlannedPortions(currentDateStr, slot) }}</span>
                                        <span v-if="isExcluded(currentDateStr, slot)" class="text-[10px] font-black text-rose-500 bg-rose-50 px-2 py-1 rounded-lg">Не покупать</span>
                                    </div>
                                </div>
                                <div class="pl-3 pr-6">
                                    <div class="text-lg font-black text-slate-900 leading-tight mb-1">{{ getPlannedDish(currentDateStr, slot).name }}</div>
                                    <div class="text-xs font-bold text-slate-400">{{ getPlannedDish(currentDateStr, slot).k * getPlannedPortions(currentDateStr, slot) }} ккал</div>
                                </div>
                                <span class="material-icons-round absolute right-4 top-1/2 -translate-y-1/2 text-slate-200 group-hover:text-slate-300 transition-colors">chevron_right</span>
                            </div>
                            <div v-else @click="openDishSelector(currentDateObj, slot)" class="border-2 border-dashed border-slate-200 rounded-3xl p-5 flex items-center justify-center tap-effect opacity-60 hover:opacity-100 transition-opacity bg-slate-50/50">
                                <span class="text-[10px] font-extrabold uppercase text-slate-400 tracking-widest">+ {{ slot }}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div v-else :key="'week'" class="space-y-4">
                        <div v-for="dayObj in planningDays" :key="dayObj.iso" class="bg-white rounded-3xl shadow-soft border border-slate-100 overflow-hidden relative">
                            <div v-if="isToday(dayObj.date)" class="absolute left-0 top-0 bottom-0 w-1 bg-slate-900"></div>
                            <div class="px-4 py-2 bg-slate-50/50 border-b border-slate-100 flex justify-between items-center">
                                <div class="flex items-baseline gap-2">
                                    <span class="text-sm font-black text-slate-900">{{ formatDate(dayObj.date) }}</span>
                                    <span class="text-[10px] font-extrabold uppercase text-slate-400">{{ getDayName(dayObj.date) }}</span>
                                </div>
                            </div>
                            <div class="grid grid-cols-5 divide-x divide-slate-50">
                                <div v-for="slot in mealSlots" :key="slot" @click="openDishSelector(dayObj.date, slot)" class="h-16 flex flex-col items-center justify-center p-1 tap-effect hover:bg-slate-50 cursor-pointer relative group">
                                    <template v-if="getPlannedDish(dayObj.iso, slot)">
                                        <div class="w-2 h-2 rounded-full mb-1" :class="getSlotColor(slot)"></div>
                                        <span class="text-[8px] font-bold leading-tight text-slate-700 line-clamp-2 text-center w-full" :class="isExcluded(dayObj.iso, slot) ? 'opacity-40 line-through' : ''">{{ getPlannedDish(dayObj.iso, slot).name }}</span>
                                    </template>
                                    <span v-else class="text-slate-200 material-icons-round text-xs scale-75">add</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    </transition>
                </div>

                <div v-else-if="currentTab === 'dishes'" class="absolute inset-0 overflow-y-auto p-5 pb-28 no-scrollbar gpu space-y-3">
                    <div v-if="filteredDishes.length===0" class="text-center py-20 opacity-50"><p class="text-sm font-bold text-slate-400">Ничего не найдено</p></div>
                    <div v-for="dish in filteredDishes" :key="dish.id" @click="openDishDetails(dish)" class="bg-white p-4 rounded-3xl shadow-soft border border-slate-50 flex justify-between items-center tap-effect cursor-pointer group">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl bg-slate-50 flex items-center justify-center text-xl shadow-inner">🍲</div>
                            <div>
                                <div class="font-extrabold text-slate-900 text-sm mb-0.5 group-hover:text-indigo-600 transition-colors">{{ dish.name }}</div>
                                <div class="flex items-center gap-2">
                                    <span class="text-[9px] font-bold bg-slate-100 text-slate-500 px-2 py-0.5 rounded-md border border-slate-200">{{ dish.category || 'Без категории' }}</span>
                                    <span class="text-[10px] font-bold text-slate-400">🔥 {{ dish.k }}</span>
                                </div>
                            </div>
                        </div>
                        <span class="material-icons-round text-slate-200">chevron_right</span>
                    </div>
                </div>

                <div v-else-if="currentTab === 'products'" class="absolute inset-0 overflow-y-auto p-5 pb-28 no-scrollbar gpu space-y-2">
                    <div v-for="prod in filteredProducts" :key="prod.id" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
                        <span class="font-bold text-slate-700 text-sm pl-2">{{ prod.name }}</span>
                        <span class="text-[10px] font-black bg-slate-100 text-slate-500 px-2.5 py-1.5 rounded-lg uppercase tracking-wider">{{ prod.unit }}</span>
                    </div>
                </div>

                <div v-else-if="currentTab === 'list'" class="absolute inset-0 overflow-y-auto p-5 pb-28 no-scrollbar gpu space-y-4">
                    <div v-if="calculatedShoppingList.filter(i => !i.checked).length > 0">
                        <h3 class="text-xs font-black text-slate-900 uppercase tracking-widest mb-3 ml-2">Нужно купить</h3>
                        <transition-group name="list" tag="div" class="space-y-2">
                            <div v-for="item in calculatedShoppingList.filter(i => !i.checked)" :key="item.id" @click="toggleProductCheck(item)" class="bg-white p-4 rounded-2xl border border-slate-100 shadow-soft flex items-center gap-4 cursor-pointer tap-effect">
                                <div class="w-6 h-6 rounded-full border-2 border-slate-200 flex items-center justify-center shrink-0"></div>
                                <div class="flex-1 text-sm font-extrabold text-slate-800">{{ item.name }}</div>
                                <div class="text-xs font-black text-slate-500 bg-slate-100 px-2 py-1 rounded-lg">{{ parseFloat(item.amount.toFixed(2)) }} {{ item.unit }}</div>
                            </div>
                        </transition-group>
                    </div>

                    <div v-if="calculatedShoppingList.filter(i => i.checked).length > 0" class="mt-8">
                        <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-3 ml-2">В корзине</h3>
                        <transition-group name="list" tag="div" class="space-y-2">
                            <div v-for="item in calculatedShoppingList.filter(i => i.checked)" :key="item.id" @click="toggleProductCheck(item)" class="bg-white/50 p-4 rounded-2xl border border-slate-100 flex items-center gap-4 cursor-pointer tap-effect opacity-60">
                                <div class="w-6 h-6 rounded-full border-2 border-indigo-500 bg-indigo-500 flex items-center justify-center shrink-0"><span class="material-icons-round text-white text-xs">check</span></div>
                                <div class="flex-1 text-sm font-bold text-slate-400 line-through decoration-2 decoration-slate-300">{{ item.name }}</div>
                                <div class="text-xs font-bold text-slate-400 bg-slate-50 px-2 py-1 rounded-lg">{{ parseFloat(item.amount.toFixed(2)) }} {{ item.unit }}</div>
                            </div>
                        </transition-group>
                    </div>

                    <div class="mt-8 pt-6 border-t border-slate-200/50">
                        <div class="flex justify-between items-center mb-4 px-2">
                            <h3 class="font-black text-slate-400 text-xs uppercase tracking-widest">Базовое</h3>
                            <button @click="addStaple" class="text-indigo-500 text-xs font-black bg-indigo-50 px-3 py-1.5 rounded-lg hover:bg-indigo-100 tap-effect">+ Добавить</button>
                        </div>
                        <div v-for="item in staples" :key="item.id" class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-3 mb-2">
                             <div @click="toggleStapleCheck(item)" class="w-6 h-6 rounded-full border-2 flex items-center justify-center cursor-pointer shrink-0 transition-colors" :class="!item.is_active ? 'bg-slate-400 border-slate-400' : 'border-slate-200'"><span v-if="!item.is_active" class="material-icons-round text-white text-xs">check</span></div>
                             <div class="flex-1 text-sm font-bold text-slate-700" :class="!item.is_active ? 'line-through decoration-slate-300 text-slate-400' : ''">{{ item.name }}</div>
                             <button @click="deleteStaple(item)" class="text-slate-300 px-2"><span class="material-icons-round text-lg">close</span></button>
                        </div>
                    </div>
                </div>
                
                <div v-else-if="currentTab === 'settings'" class="absolute inset-0 overflow-y-auto p-5 pb-28 no-scrollbar gpu space-y-6">
                    <div class="bg-white rounded-3xl shadow-soft border border-slate-100 overflow-hidden">
                        <div class="p-5 border-b border-slate-50">
                            <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Дней в периоде</label>
                            <input v-model.number="settings.planning_days" type="number" class="w-full text-2xl font-black text-slate-900 outline-none bg-transparent placeholder-slate-200" placeholder="7">
                        </div>
                        <div class="p-5 flex justify-between items-center">
                            <label class="text-sm font-extrabold text-slate-900">Порций по умолчанию</label>
                            <div class="flex items-center gap-3 bg-slate-50 rounded-xl p-1.5">
                                <button @click="settings.default_portions = Math.max(1, (settings.default_portions||1) - 1)" class="w-8 h-8 flex items-center justify-center bg-white rounded-lg shadow-sm text-slate-900 font-bold">-</button>
                                <span class="font-black text-slate-900 w-5 text-center">{{ settings.default_portions || 1 }}</span>
                                <button @click="settings.default_portions = (settings.default_portions||1) + 1" class="w-8 h-8 flex items-center justify-center bg-white rounded-lg shadow-sm text-slate-900 font-bold">+</button>
                            </div>
                        </div>
                    </div>
                    <button @click="handleLogout" class="w-full py-5 text-rose-500 font-black bg-rose-50 rounded-3xl tap-effect">Выйти из аккаунта</button>
                </div>

             </transition>
        </main>

        <nav class="glass-nav fixed bottom-0 left-0 right-0 max-w-md mx-auto z-50 pb-safe">
            <div class="grid grid-cols-5 h-20 items-center px-2">
                <button v-for="tab in tabs" :key="tab.id" @click="currentTab = tab.id" :class="currentTab === tab.id ? 'text-slate-900' : 'text-slate-300'" class="flex flex-col items-center justify-center tap-effect group relative">
                    <div v-if="currentTab === tab.id" class="absolute -top-3 w-8 h-1 bg-slate-900 rounded-b-full shadow-lg shadow-slate-900/20"></div>
                    <span class="material-icons-round text-[26px] transition-transform duration-200 group-active:scale-90" :class="currentTab === tab.id ? '-translate-y-1' : ''">{{ tab.icon }}</span>
                    <span v-if="currentTab === tab.id" class="text-[9px] font-black mt-1 absolute bottom-3 transition-opacity duration-300">{{ tab.label }}</span>
                </button>
            </div>
        </nav>

        <transition name="modal">
        <div v-if="showSelectorModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-end justify-center" @click.self="showSelectorModal = false">
             <div class="bg-white w-full max-w-sm rounded-t-[40px] shadow-2xl overflow-hidden flex flex-col max-h-[85vh] pb-safe">

            const getPlannedDish = (dateStr, slot) => planMap.value[dateStr + '|' + slot]?.dish;
            const getPlannedPortions = (dateStr, slot) => planMap.value[dateStr + '|' + slot]?.portions || 1;
            const isExcluded = (dateStr, slot) => planMap.value[dateStr + '|' + slot]?.exclude;
            const getSlotColor = (slot) => ({ 'Завтрак': 'bg-orange-400', 'Обед': 'bg-teal-400', 'Гарнир': 'bg-amber-400', 'Салат': 'bg-lime-400', 'Перекус': 'bg-indigo-400' }[slot] || 'bg-slate-300');
            const isToday = (d) => d.toISOString().split('T')[0] === new Date().toISOString().split('T')[0];
            const formatDate = (d) => d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
            const getDayName = (d) => d.toLocaleDateString('ru-RU', { weekday: 'short' });
            const handleNav = (dir) => { const d = new Date(currentDateObj.value); d.setDate(d.getDate() + (planViewMode.value==='day'?1:(settings.value.planning_days||7))*dir); currentDateObj.value = d; };

            watch(currentTab, (newVal, oldVal) => { const newI = tabOrder.indexOf(newVal); const oldI = tabOrder.indexOf(oldVal); mainTransitionName.value = newI > oldI ? 'slide-left' : 'slide-right'; });
            onMounted(async () => { const { data: { session } } = await supabase.auth.getSession(); if(session) { user.value = session.user; loadInitialData(); } });

            return {
                user, authEmail, authPass, loading, handleLogin, handleLogout,
                currentTab, tabs, pageTitle, planViewMode, planningDays, mealSlots, dishCategories, productCategories,
                products, dishes, staples, calculatedShoppingList, shoppingRangeDisplay, shoppingProgress, shoppingStats, dailyNutrition,
                filteredDishes, filteredProducts, filteredSelectorDishes, filteredIngSuggestions, genericSearch, selectorSearch, ingSearch, activeCategory,
                showSelectorModal, selectorContext, showDishModal, newDish, newDishIngredients, showProdModal, newProd, showDetailModal, selectedDish, ingredientsMap,
                currentDateStr, currentDateDisplay, dayNameDisplay, currentDateObj, getPlannedDish, getPlannedPortions, isExcluded, getSlotColor, isToday, formatDate, getDayName,
                createProduct, openDishModal, addIngToDish, saveDish, openDishSelector, selectDishForPlan, handleNav, loadInitialData,
                toggleProductCheck, uncheckAll, addStaple, deleteStaple, toggleStapleCheck, openDishDetails,
                mainTransitionName, settings, saveSettings
            };
          }
        }).mount('#app');
    } catch (e) { alert("CRITICAL:\n" + e); }
  </script>

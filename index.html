<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>MealMe</title>
    <!-- Telegram Mini Apps SDK грузим ТОЛЬКО внутри Telegram. Для обычных
         посетителей скрипт с telegram.org не нужен, а в России этот домен часто
         замедляют — и пока скрипт висит, приложение не запускается (порядок
         отложенных скриптов). Внутри Telegram его домен доступен всегда. -->
    <script>
      (function () {
        var inTelegram = /tgWebApp/.test(location.hash + location.search) ||
          'TelegramWebviewProxy' in window ||
          (function () { try { return !!sessionStorage.getItem('__telegram__initParams') } catch (e) { return false } })()
        if (inTelegram) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
